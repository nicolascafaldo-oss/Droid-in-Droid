[package]
name = "kestrel_sandbox"
version = "0.2.0"
edition = "2021"
description = "Clean-room Rust syscall/seccomp-bpf and userspace Binder IPC sandbox engine for KestrelVM"

[lib]
name = "kestrel_sandbox"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
libc = "0.2"
nix = { version = "0.29", features = ["ptrace", "process", "signal", "fs"] }
log = "0.4"
android_logger = "0.14"
